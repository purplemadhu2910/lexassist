services:
  - type: web
    name: lexassist-backend
    runtime: python
    pythonVersion: "3.11"
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: lexassist-frontend
    runtime: python
    pythonVersion: "3.11"
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: cd frontend && streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_URL
        sync: false
