services:
  - type: web
    name: lexassist-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && python ingestion/load_pdfs.py && python ingestion/load_json.py && python ingestion/load_excel.py && python ingestion/chunk_text.py && python backend/build_index.py
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: lexassist-frontend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: cd frontend && streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
